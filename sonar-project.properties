sonar.organization=trustwallet-1
# Analysed sources are UTF-8; without this the scanner falls back to the
# platform default and reports encoding problems when it meets a binary asset.
sonar.sourceEncoding=UTF-8
sonar.projectKey=trustwallet_wallet-core
sonar.cfamily.compile-commands=build/compile_commands.json
# Test coverage, converted from the lcov tracefile by `tools/coverage sonar`.
sonar.coverageReportPaths=coverage-sonar.xml
sonar.cfamily.reportingCppStandardOverride=c++20
sonar.cfamily.cache.enabled=false
sonar.lang.patterns.cpp=**/*.cc,**/*.cpp,**/*.cxx,**/*.c++,**/*.hh,**/*.hpp,**/*.hxx,**/*.h++,**/*.ipp,**/*.h
sonar.lang.patterns.c=**/*.c
# Only trezor-crypto/crypto/setup.py is in scope; the rest live under excluded tests.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13

# The scanner CLI is unzipped into the working directory by
# tools/sonarcloud-analysis — keep it out of the analysis scope.
# Test code is also excluded: it embeds well-known public test vectors
# (mnemonics, private keys) that trip secret-detection rules (S6418/S2068).
# The coverage report and the gtest XML are inputs, not sources.
# Binary assets (launcher icons, the Gradle wrapper) are not sources; leaving them
# in scope is what makes the scanner report file-encoding problems.
sonar.exclusions=sonar-scanner-*/**,sonar-scanner-cli-*.zip,tests/**,android/app/src/androidTest/**,trezor-crypto/crypto/tests/**,coverage-sonar.xml,coverage.info,test_detail.xml,**/*.png,**/*.jar
