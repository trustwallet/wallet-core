syntax = "proto3";

package TW.Solana.Proto;
option java_package = "wallet.core.jni.proto";

import "Common.proto";

// Transfer transaction
message Transfer {
    // destination address
    string recipient = 1;

    // amount
    uint64 value = 2;

    // optional memo
    string memo = 3;

    // optional referenced public keys
    repeated string references = 4;
}

// Create and initialize a stake account, and delegate amount to it.
// Recommendation behavior is to not specify a stake account, and a new unique account will be created each time.
// Optionally a stake account pubkey can be specified, but it should not exist on chain.
message DelegateStake {
    // Validator's public key
    string validator_pubkey = 1;

    // delegation amount
    uint64 value = 2;

    // staking account
    string stake_account = 3;
}

// Deactivate staking on stake account
message DeactivateStake {
    // staking account
    string stake_account = 1;
}

// Deactivate staking on multiple stake account
message DeactivateAllStake {
    // staking accounts
    repeated string stake_accounts = 1;
}

// Withdraw amount from stake account
message WithdrawStake {
    // staking account
    string stake_account = 1;

    // withdrawal amount
    uint64 value = 2;
}

// Technical structure to group a staking account and an amount
message StakeAccountValue {
    // staking account
    string stake_account = 1;

    // amount
    uint64 value = 2;
}

// Withdraw amounts from stake accounts
message WithdrawAllStake {
    repeated StakeAccountValue stake_accounts = 1;
}

enum TokenProgramId {
    TokenProgram = 0;
    Token2022Program = 1;
}

// Create a token account under a main account for a token type
message CreateTokenAccount {
    // main account -- can be same as signer, or other main account (if done on some other account's behalf)
    string main_address = 1;

    // Token minting address
    string token_mint_address = 2;

    // Token address
    string token_address = 3;

    // optional token program id
    TokenProgramId token_program_id = 4;
}

// Transfer tokens
message TokenTransfer {
    // Mint address of the token
    string token_mint_address = 1;

    // Source address
    string sender_token_address = 2;

    // Destination address
    string recipient_token_address = 3;

    // Amount
    uint64 amount = 4;

    // Note: 8-bit value
    uint32 decimals = 5;

    // optional memo§
    string memo = 6;

    // optional referenced public keys
    repeated string references = 7;

    // optional token program id
    TokenProgramId token_program_id = 8;
}

// CreateTokenAccount and TokenTransfer combined
message CreateAndTransferToken {
    // main account -- can be same as signer, or other main account (if done on some other account's behalf)
    string recipient_main_address = 1;

    // Mint address of the token
    string token_mint_address = 2;

    // Token address for the recipient, will be created first
    string recipient_token_address = 3;

    // Sender's token address
    string sender_token_address = 4;

    // amount
    uint64 amount = 5;

    // Note: 8-bit value
    uint32 decimals = 6;

    // optional
    string memo = 7;

    // optional referenced public keys
    repeated string references = 8;

    // optional token program id
    TokenProgramId token_program_id = 9;
}

// Transfer tokens to the feepayer
message TokenTransferToFeePayer {
    // Mint address of the fee token
    string fee_token_mint_address = 1;

    // Token account address of the fee recipient.
    // Note that it could be different from the token account of the feepayer.
    string fee_recipient_token_address = 2;

    // Fee amount
    uint64 fee_amount = 3;

    // Sender's fee token address
    string fee_sender_token_address = 4;

    // Note: 8-bit value
    uint32 fee_decimals = 5;

    // optional token program id
    TokenProgramId fee_token_program_id = 6;
}

message CreateNonceAccount {
    // Required for building pre-signing hash of a transaction
    string nonce_account = 1;
    uint64 rent = 2;
    // Optional for building pre-signing hash of a transaction
    bytes nonce_account_private_key = 3;
}

message WithdrawNonceAccount {
    string nonce_account = 1;
    string recipient = 2;
    uint64 value = 3;
}

message AdvanceNonceAccount {
    string nonce_account = 1;
}

message PubkeySignature {
    string pubkey = 1;
    // base58 encoded signature.
    string signature = 2;
}

message RawMessage {
    message MessageHeader {
        uint32 num_required_signatures = 1;
        uint32 num_readonly_signed_accounts = 2;
        uint32 num_readonly_unsigned_accounts = 3;
    }

    message Instruction {
        uint32 program_id = 1;
        repeated uint32 accounts = 2 [packed = true];
        bytes program_data = 3;
    }

    message MessageAddressTableLookup {
        string account_key = 1;
        repeated uint32 writable_indexes = 2 [packed = true];
        repeated uint32 readonly_indexes = 3 [packed = true];
    }

    message MessageLegacy {
        MessageHeader header = 1;
        repeated string account_keys = 2;
        // Relatively recent block hash (base58 encoded).
        string recent_blockhash = 3;
        repeated Instruction instructions = 4;
    }

    message MessageV0 {
        MessageHeader header = 1;
        repeated string account_keys = 2;
        // Relatively recent block hash (base58 encoded).
        string recent_blockhash = 3;
        repeated Instruction instructions = 4;
        repeated MessageAddressTableLookup address_table_lookups = 5;
    }

    // Transaction signatures.
    // If private keys are set in `SigningInput`, corresponding signatures will be overriden.
    // It's also possible some or all the signatures are be used to compile a transaction if corresponding private keys are not set.
    repeated PubkeySignature signatures = 1;
    oneof message {
        MessageLegacy legacy = 2;
        MessageV0 v0 = 3;
    }
}

message DecodingTransactionOutput {
    // Decoded transaction info.
    RawMessage transaction = 1;

    // Error code, 0 is ok, other codes will be treated as errors
    Common.Proto.SigningError error = 2;

    // Error code description
    string error_message = 3;
}

enum Encoding {
    Base58 = 0;
    Base64 = 1;
}

// Specific compute unit limit that the transaction is allowed to consume.
message PriorityFeePrice {
    uint64 price = 1;
}

// Compute unit price in "micro-lamports" to pay a higher transaction fee for higher transaction prioritization.
message PriorityFeeLimit {
    uint32 limit = 2;
}

// Input data necessary to create a signed transaction.
message SigningInput {
    // The secret private key used for signing (32 bytes).
    bytes private_key = 1;

    // Relatively recent block hash
    string recent_blockhash = 2;

    bool v0_msg = 3;

    // Payload message
    oneof transaction_type {
        Transfer transfer_transaction = 4;
        DelegateStake delegate_stake_transaction = 5;
        DeactivateStake deactivate_stake_transaction = 6;
        DeactivateAllStake deactivate_all_stake_transaction = 7;
        WithdrawStake withdraw_transaction = 8;
        WithdrawAllStake withdraw_all_transaction = 9;
        CreateTokenAccount create_token_account_transaction = 10;
        TokenTransfer token_transfer_transaction = 11;
        CreateAndTransferToken create_and_transfer_token_transaction = 12;
        CreateNonceAccount create_nonce_account = 13;
        WithdrawNonceAccount withdraw_nonce_account = 16;
        AdvanceNonceAccount advance_nonce_account = 19;
    }
    // Required for building pre-signing hash of a transaction
    string sender = 14;
    // Required for using durable transaction nonce
    string nonce_account = 15;
    // Optional external fee payer private key. support: TokenTransfer, CreateAndTransferToken
    bytes fee_payer_private_key = 17;
    // Optional external fee payer. support: TokenTransfer, CreateAndTransferToken
    string fee_payer = 18;
    // Optional message plan. For signing an already prepared message.
    RawMessage raw_message = 20;
    // Output transaction encoding.
    Encoding tx_encoding = 21;
    // Optional. Set a specific compute unit limit that the transaction is allowed to consume.
    // https://solana.com/docs/intro/transaction_fees#prioritization-fee
    PriorityFeePrice priority_fee_price = 22;
    // Optional. Set a compute unit price in "micro-lamports" to pay a higher transaction
    // fee for higher transaction prioritization.
    // https://solana.com/docs/intro/transaction_fees#prioritization-fee
    PriorityFeeLimit priority_fee_limit = 23;
    // Optional token transfer to fee payer.
    TokenTransferToFeePayer token_transfer_to_fee_payer = 24;
    // Optional SOL transfer to fee payer. This will be the last instruction in the transaction.
    // https://docs.blinklabs.xyz/blink/solana/gas-sponsorship/api-reference#active-sponsorship
    Transfer transfer_to_fee_payer = 25;
}

// Result containing the signed and encoded transaction.
message SigningOutput {
    // The encoded transaction
    string encoded = 1;

    // error code, 0 is ok, other codes will be treated as errors
    Common.Proto.SigningError error = 2;

    // error code description
    string error_message = 3;

    // The encoded message. Can be used to estimate a transaction fee required to execute the message.
    string unsigned_tx = 4;

    // Transaction signatures (may include external signatures).
    repeated PubkeySignature signatures = 5;
}

/// Transaction pre-signing output
message PreSigningOutput {
    // Signer list
    repeated bytes signers = 1;

    // Pre-image data. There is no hashing for Solana presign image
    bytes data = 2;

    // Error code, 0 is ok, other codes will be treated as errors
    Common.Proto.SigningError error = 3;

    // Error code description
    string error_message = 4;
}

// How the bytes that actually get signed are produced from the message.
enum MessageType {
    // Sign the UTF-8 message bytes as they are, with no domain separator and no envelope.
    // This is what this coin has always done (the Solana cookbook "sign message" recipe).
    // Nothing in the bytes tells a wallet or a verifier that they are not some other payload,
    // which is the reason the off-chain standard below exists.
    MessageType_raw = 0;

    // Solana Off-Chain Message Signing, header version 0, laid out as the off-chain message
    // signing *proposal* specifies it: the b"\xffsolana offchain" signing domain (0xff can never
    // start a transaction), the application domain, the message format, the signer, and the
    // length-prefixed body — an 85-byte preamble.
    //
    // These bytes are NOT compatible with `solana_sdk`'s shipped `offchain_message::v0`, which
    // implements a reduced form of the same proposal: a 20-byte preamble of signing domain,
    // version, format and length, with no application domain and no signer list, and a format
    // byte derived from the body instead of pinned. So a signature produced here does not verify
    // with `solana verify-offchain-signature`, and `solana sign-offchain-message` (or a Ledger
    // driven by it) cannot produce one. The fuller preamble is the deliberate choice: the
    // application domain is what stops a signature over one application's messages from
    // verifying against another's, and it is the layout the services that consume these
    // signatures rebuild.
    //
    // The header version is part of the name on purpose. Only version 0 is specified; the later
    // proposal that removes the application domain would be a `MessageType_offchain_v1`, never
    // an edit to this one, because it would change every signature.
    MessageType_offchain_v0 = 1;
}

// What the body's bytes are, which the off-chain header states and a verifier may enforce.
//
// The numbers here are this proto's own, not the standard's: the standard writes restricted
// ASCII as format byte 0 and UTF-8 as 1, and the header byte comes from a mapping rather than
// from this value. UTF-8 sits at 0 so that an input naming no format keeps signing the bytes it
// signed before this field existed.
enum MessageFormat {
    // UTF-8 (header byte 1). Carries anything a string can hold, including the newline a labeled
    // body is built from. A hardware wallet cannot render it, so approving one is blind-signing.
    MessageFormat_utf8 = 0;

    // Restricted ASCII (header byte 0): every byte printable ASCII, 0x20..=0x7e. That **excludes
    // the newline and the tab**, so a `StructuredMessage` of more than one line cannot be signed
    // in this format, and a body that needs one is refused rather than silently mislabeled. What
    // it buys is the only format a hardware wallet displays, so the person approving reads the
    // message instead of signing a hash they cannot check.
    MessageFormat_restricted_ascii = 1;
}

// One "<label>: <value>" line of a `StructuredMessage`.
message StructuredField {
    // Rendered before ": ". Must not be empty, and must carry no control character.
    string label = 1;

    // Rendered after ": ". Must not be empty, and must carry no control character: a value
    // containing a newline would forge further labeled lines in the message a user is about to
    // approve. Pass a placeholder such as "-" for a field that is legitimately absent.
    string value = 2;
}

// A message laid out as labeled lines, rendered by this library so that every platform
// produces the same bytes from the same fields.
//
// This layout is NOT a Solana standard. The off-chain message standard constrains the encoding
// and the length and treats the body as opaque application bytes; this is one way to fill it,
// written in the SIWE/SIWS idiom but deliberately not a conformant SIWS message.
message StructuredMessage {
    // Optional first line, rendered bare with no label — an application name and version, say.
    string header = 1;

    // Rendered as "<label>: <value>", one line each, in exactly this order. Order is part of
    // the signed bytes, so it is the caller's to fix and this library never sorts it.
    repeated StructuredField fields = 2;

    // Optional closing sentence, rendered bare after one blank line. It is the line a person
    // actually reads before approving, so it comes last and ends the message.
    string statement = 3;
}

message MessageSigningInput {
    // The secret private key used for signing (32 bytes). Required to sign; required for a
    // pre-image only when `public_key` is not given.
    bytes private_key = 1;

    // The public key of the signer (32 bytes), for asking `TWMessageSignerPreImageHashes` for
    // the bytes to sign without holding the secret — the external-signing flow, where the key
    // lives in a hardware wallet. `MessageType_offchain_v0` states the signer inside the signed
    // bytes, so its pre-image cannot be built without one of the two keys; `MessageType_raw`
    // needs neither. Ignored when signing, which takes the signer from `private_key`.
    bytes public_key = 6;

    // How the signed bytes are produced. Defaults to `MessageType_raw`, which is what this coin
    // did before the other types existed.
    MessageType message_type = 3;

    // The 32-byte application domain of the off-chain message header: the caller's own domain
    // separator, which is what stops a signature over its messages from verifying against
    // another application's. Required for `MessageType_offchain_v0`, and refused for
    // `MessageType_raw`, which signs the body bare and has no header to state one in.
    bytes application_domain = 4;

    // The format byte the off-chain header states, and what the body is then checked against.
    // Defaults to `MessageFormat_utf8`. Refused for `MessageType_raw` for the same reason a
    // domain is: there is no header to put it in.
    MessageFormat message_format = 7;

    // The message to sign, in one of the forms below.
    oneof message_payload {
        // A UTF-8 regular message to sign.
        //
        // Keep it a `string`. `MessageType_raw` signs the body as it stands, and its being
        // UTF-8 is what keeps those bytes from ever forming a Solana transaction message —
        // see the note on the raw arm in `message_signer.rs` before making it `bytes`.
        string message = 2;

        // Labeled lines that this library renders into the message body.
        StructuredMessage structured_message = 5;
    }
}

message MessageSigningOutput {
    // The signature, Base58-encoded.
    string signature = 1;

    // error code, 0 is ok, other codes will be treated as errors
    Common.Proto.SigningError error = 2;

    // error code description
    string error_message = 3;
}

message MessageVerifyingInput {
    // Public key that will verify and recover the message from the signature.
    bytes public_key = 2;

    // The signature, Base58-encoded.
    string signature = 3;

    // How the signed bytes were produced. Must match what the signer used, since it decides
    // which bytes the signature is checked against.
    MessageType message_type = 4;

    // The 32-byte application domain of the off-chain message header. Required for
    // `MessageType_offchain_v0`, and refused for `MessageType_raw`.
    bytes application_domain = 5;

    // The format byte the signer stated. Like `message_type`, it must match what was signed,
    // since the byte is inside the signed bytes.
    MessageFormat message_format = 8;

    // Held open: field 6 was `string message` for part of this feature's review, before that
    // field went back to 1 where it has always been. Reusing the number would let an encoder
    // built against that revision put a message where a later field is read.
    reserved 6;

    // The message signed, in one of the forms below.
    oneof message_payload {
        // The message signed.
        string message = 1;

        // Labeled lines that this library renders into the message body.
        StructuredMessage structured_message = 7;
    }
}
