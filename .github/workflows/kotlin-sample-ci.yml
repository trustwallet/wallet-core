name: Kotlin Multiplatform CI

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      # Nothing below can change an Apple, Android, Kotlin or Rust build, and every
      # run of these workflows bills macOS Large or XLarge minutes.
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
      - 'sonar-project.properties'
      - 'tools/sonar-scanner.properties'
      - 'tools/sonarcloud-analysis'
      - 'tools/coverage'
      - 'tools/check-coverage'
      - 'tools/lcov-to-sonar-xml'
      - '.github/workflows/linux-ci-sonarcloud.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/claude-bc-risk-router.yml'
      - 'Dockerfile'
      - 'gitpod.Dockerfile'
      - '.devcontainer/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      # Nothing below can change an Apple, Android, Kotlin or Rust build, and every
      # run of these workflows bills macOS Large or XLarge minutes.
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
      - 'sonar-project.properties'
      - 'tools/sonar-scanner.properties'
      - 'tools/sonarcloud-analysis'
      - 'tools/coverage'
      - 'tools/check-coverage'
      - 'tools/lcov-to-sonar-xml'
      - '.github/workflows/linux-ci-sonarcloud.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/claude-bc-risk-router.yml'
      - 'Dockerfile'
      - 'gitpod.Dockerfile'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14-xlarge
    if: github.event.pull_request.draft == false
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Kotlin Dependencies
      run: tools/install-kotlin-dependencies

    - name: Build KMP Sample
      run: |
        ./gradlew --version
        ./gradlew assemble
      working-directory: samples/kmp
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
