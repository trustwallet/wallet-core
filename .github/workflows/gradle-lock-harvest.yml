name: Gradle Lock Harvest

on:
  push:
    branches: [ dev, master ]
    paths:
      - 'android/**'
      - 'kotlin/**'
      - 'samples/android/**'
      - 'samples/kmp/**'
      - '.github/workflows/gradle-lock-harvest.yml'
  pull_request:
    branches: [ dev, master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'android/**'
      - 'kotlin/**'
      - 'samples/android/**'
      - 'samples/kmp/**'
      - '.github/workflows/gradle-lock-harvest.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  harvest:
    runs-on: ubuntu-24.04
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 8.10.2

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(source tools/android-sdk && find_android_cmdline_tools)/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;28.0.12674087"

      - name: Harvest dependency locks
        run: |
          (
            cd android
            ./gradlew dependencies :app:dependencies :wallet-core:dependencies :wallet-core-proto:dependencies --write-locks --no-daemon
          )
          (
            cd kotlin
            ./gradlew dependencies :wallet-core-kotlin:dependencies --write-locks --no-daemon
            cd build-logic
            ../gradlew dependencies --write-locks --no-daemon
          )
          (
            cd samples/android
            ./gradlew dependencies :app:dependencies --write-locks --no-daemon
          )
          (
            cd samples/kmp
            ./gradlew dependencies :shared:dependencies :androidApp:dependencies --write-locks --no-daemon
          )
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check lockfile changes
        id: locks
        run: |
          git add -- ':(glob)**/*gradle.lockfile'
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Upload changed lock state
        if: steps.locks.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gradle-lockfiles
          path: |
            android/**/*gradle.lockfile
            kotlin/**/*gradle.lockfile
            samples/android/**/*gradle.lockfile
            samples/kmp/**/*gradle.lockfile
          if-no-files-found: error

      - name: Require lockfile update
        if: steps.locks.outputs.changed == 'true'
        run: |
          echo "::error::Gradle lockfiles changed. Download gradle-lockfiles, copy the files into the repository, and commit the updates."
          exit 1
