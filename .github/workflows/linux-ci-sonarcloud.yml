name: Linux CI SonarCloud

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip drafts; push events (dev/master) always run. Re-enabled after the
    # analysis moved to the trustwallet-1 SonarCloud organization.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # SonarCloud needs full history for blame data; a shallow clone drops SCM
          # info and with it issue auto-assignment.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          tools/install-sys-dependencies-linux
          tools/install-rust-dependencies

      - name: Cache internal dependencies
        id: internal_cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: build/local
          key: ${{ runner.os }}-${{ runner.arch }}-internal-${{ hashFiles('tools/install-dependencies') }}-${{ hashFiles('tools/dependencies-version') }}

      - name: Install internal dependencies
        run: |
          tools/install-dependencies
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        if: steps.internal_cache.outputs.cache-hit != 'true'

      - name: Code generation
        run: |
          tools/generate-files native
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++

      - name: Compile JNI Java sources for SonarCloud
        run: |
          set -eux
          mkdir -p build/sonar-java
          # codegen above already wrote jni/java/wallet/core/jni; giving the Java
          # analyser bytecode is what lifts it out of its less precise fallback mode.
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "https://repo1.maven.org/maven2/com/google/protobuf/protobuf-javalite/${PROTOBUF_JAVALITE_VERSION}/protobuf-javalite-${PROTOBUF_JAVALITE_VERSION}.jar" \
            -o build/protobuf-javalite.jar
          echo "9d26bebd2607fd0553cedbfc3e4a3d3f06c6e7a207d2b74c87fa6181838ed1bf  build/protobuf-javalite.jar" | sha256sum -c -
          find jni/java -name '*.java' > build/java-sources.txt
          javac -nowarn -proc:none -d build/sonar-java \
            -cp build/protobuf-javalite.jar -sourcepath jni/java @build/java-sources.txt
        env:
          # Keep in step with android/wallet-core-proto/build.gradle.
          PROTOBUF_JAVALITE_VERSION: 3.22.3

      - name: CMake (coverage/clang-tidy/clang-asan)
        run: |
          cmake -H. -Bbuild -DCMAKE_BUILD_TYPE=Debug -DTW_CODE_COVERAGE=ON -DTW_ENABLE_CLANG_TIDY=ON -DTW_CLANG_ASAN=ON -GNinja
          cat build/compile_commands.json
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++

      - name: Build and run tests
        run: |
          ninja -Cbuild tests TrezorCryptoTests
          find build -name "*.gcda" -delete
          build/trezor-crypto/crypto/tests/TrezorCryptoTests
          build/tests/tests --gtest_output=xml
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          CK_TIMEOUT_MULTIPLIER: 4

      - name: Generate coverage report for SonarCloud
        run: |
          tools/coverage sonar

      - name: SonarCloud Scan
        run: |
          ./tools/sonarcloud-analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
