name: iOS CI

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      # Nothing below can change an Apple, Android, Kotlin or Rust build, and every
      # run of these workflows bills macOS Large or XLarge minutes.
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
      - 'sonar-project.properties'
      - 'tools/sonar-scanner.properties'
      - 'tools/sonarcloud-analysis'
      - 'tools/coverage'
      - 'tools/check-coverage'
      - 'tools/lcov-to-sonar-xml'
      - '.github/workflows/linux-ci-sonarcloud.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/claude-bc-risk-router.yml'
      - 'Dockerfile'
      - 'gitpod.Dockerfile'
      - '.devcontainer/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      # Nothing below can change an Apple, Android, Kotlin or Rust build, and every
      # run of these workflows bills macOS Large or XLarge minutes.
      - '**/*.md'
      - 'docs/**'
      - 'audit/**'
      - 'sonar-project.properties'
      - 'tools/sonar-scanner.properties'
      - 'tools/sonarcloud-analysis'
      - 'tools/coverage'
      - 'tools/check-coverage'
      - 'tools/lcov-to-sonar-xml'
      - '.github/workflows/linux-ci-sonarcloud.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/claude-bc-risk-router.yml'
      - 'Dockerfile'
      - 'gitpod.Dockerfile'
      - '.devcontainer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-xlarge
    if: github.event.pull_request.draft == false
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Install system dependencies
      run: |
        tools/install-sys-dependencies-mac

    - name: Cache Rust
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        workspaces: |
          rust

    - name: Install Rust dependencies
      run: |
        tools/install-rust-dependencies

    - name: Cache internal dependencies
      id: internal_cache
      uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
      with:
        path: build/local
        key: ${{ runner.os }}-${{ runner.arch }}-internal-${{ hashFiles('tools/install-dependencies') }}-${{ hashFiles('tools/dependencies-version') }}

    - name: Install internal dependencies
      run: |
        tools/install-dependencies
      if: steps.internal_cache.outputs.cache-hit != 'true'

    - name: Run codegen tests
      run: tools/codegen-test

    - name: Run iOS tests
      run: |
        tools/generate-files ios
        tools/ios-test

    - name: Build sample app
      run: |
        tools/samples-build ios
